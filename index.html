<!DOCTYPE html>
<html lang="id">
<head>

                    colors: {
                        corporate: {

    <style>
        /* Gaya khusus pencetakan dokumen */
        @media print {
            @page { margin: 2cm; size: A4; }
            body { font-family: 'Times New Roman', Times, serif; background: white; color: black; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            .page-break { page-break-before: always; }
            table { width: 100% !important; border-collapse: collapse; }
            th, td { border: 1px solid black; padding: 6px; }

</head>
<body class="antialiased min-h-screen flex flex-col bg-slate-50">

    <!-- Script Utama -->
    <script>
        /**
         * STATE MANAGEMENT
         */
        const STORAGE_KEY = 'smart_sas_draft_v2';
        // URL WebApp GAS Anda (Isi jika hosting di GitHub Pages agar terhubung ke Spreadsheet)
        const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbx9f_lElgqJcBjqVclR5aSoMgzmQNUCa0dpjONY3QIF2fGFI9neXUdYk0vrgVlhNMjy/exec'; 
        // Simulasi Database Global GAS
        let db = { 
            archives: [],
            users: [
                { Username: 'ADMIN', Password: 'adminfull123', Role: 'admin' },
                { Username: 'guru1', Password: '123', Role: 'guru' }
            ]
        }; 

        let appState = {
            identitas: {
                mapel: '',
                kelas: '',
                semester: '',
                kurikulum: 'Merdeka',
                guru: ''
            },
            blocks: [] // Berisi object konfigurasi per baris materi
        };

        let generatedData = []; // Array flat untuk setiap butir soal setelah dikalkulasi

        window.onload = init;

        function init() {
            // Load database ke memory dulu agar kredensial admin/guru dapat divalidasi
            loadServerData(() => {
                checkLogin();
            });
        }

        /**
         * FUNGSI TOGGLE PASSWORD VISIBILITY
         */
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById('icon-' + inputId);
            if (input.type === 'password') {
                input.type = 'text';
                // Ikon mata dicoret (invisible)
                icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>`;
            } else {
                input.type = 'password';
                // Ikon mata terbuka (visible)
                icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>`;
            }
        }

        /**
         * LOGIN SYSTEM
         */
        function checkLogin() {
            const isLoggedIn = sessionStorage.getItem('sas_logged_in');
            const role = sessionStorage.getItem('sas_role');
            
            if (isLoggedIn) {
                if (role === 'admin') showAdmin();
                else showSetup();
            } else {
                showLogin();
            }
        }

        function doLogin() {
            const user = document.getElementById('login-username').value;
            const pass = document.getElementById('login-password').value;
            
            if (!user || !pass) {
                alert('Silakan masukkan username dan password!');
                return;
            }

            // Validasi kredensial ke Database
            const foundUser = db.users && db.users.find(u => u.Username === user && u.Password === pass);
            
            if (foundUser) {
                sessionStorage.setItem('sas_logged_in', 'true');
                sessionStorage.setItem('sas_role', foundUser.Role);
                
                if (foundUser.Role === 'admin') {
                    showAdmin();
                } else {
                    showSetup();
                }
            } else {
                alert('Username atau password tidak ditemukan/salah!');
            }
        }

        function logout() {
            sessionStorage.removeItem('sas_logged_in');
            sessionStorage.removeItem('sas_role');
            showLogin();
        }

        function showLogin() {
            document.getElementById('main-header').classList.add('hidden');
            document.getElementById('view-setup').classList.add('hidden');
            document.getElementById('view-results').classList.add('hidden');
            document.getElementById('view-admin').classList.add('hidden');
            document.getElementById('view-login').classList.remove('hidden');
        }

        function showSetup() {
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('view-admin').classList.add('hidden');
            document.getElementById('main-header').classList.remove('hidden');
            document.getElementById('view-setup').classList.remove('hidden');
            
            loadLocalDraft(); // Load draft jika browser refresh

            if (appState.blocks.length === 0) {
                addBlock();
            } else {
                renderAllBlocks();
            }
            populateIdentitasUI();
            setupAutoSave();
            updateSummary();
        }

        function showAdmin() {
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('view-setup').classList.add('hidden');

                return;
            }

            const totalSoal = appState.blocks.reduce((acc, curr) => 
                acc + (parseInt(curr.jmlMudah)||0) + (parseInt(curr.jmlSedang)||0) + (parseInt(curr.jmlSulit)||0), 0);

            const record = {
                id: 'SAS-' + new Date().getTime(),

                        endLoading();

                    .withFailureHandler(err => {

                        endLoading();
                    })
                    .saveArchive(record);

                // GITHUB SAVE PRODUCTION (Fetch POST ke GAS API)
                fetch(GAS_API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'saveData', data: record })
                })
                .then(response => response.json())
                .then(res => {

        function updateBlock(id, field, value) {
            const block = appState.blocks.find(b => b.id === id);
            if (block) {
                if (['jmlMudah', 'jmlSedang', 'jmlSulit'].includes(field)) {
                    value = parseInt(value) || 0;
                    if (value < 0) value = 0;
                }
                block[field] = value;
                saveState();
            }
        }

        function updateSummary() {
            let total = 0;
            appState.blocks.forEach(b => {
                total += (parseInt(b.jmlMudah)||0) + (parseInt(b.jmlSedang)||0) + (parseInt(b.jmlSulit)||0);
            });
            const badge = document.getElementById('total-soal-badge');
            if(badge) badge.innerText = total;
        }

        /**
         * IMAGE HANDLING (Konversi ke Base64 lokal tanpa server)
         */
        function handleImageUpload(event, blockId) {
            const file = event.target.files[0];
            if (!file) return;

            // Validasi ukuran < 2MB
            if (file.size > 2 * 1024 * 1024) {
                alert("Ukuran gambar maksimal 2MB!");
                event.target.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                updateBlock(blockId, 'imgBase64', e.target.result);
            };
            reader.readAsDataURL(file);
        }

        /**
         * LOGIKA GENERATOR UTAMA
         */
        function generateSAS() {
            // 1. Validasi Identitas
            const mapel = document.getElementById('id-mapel').value;
            const kelas = document.getElementById('id-kelas').value;
            const semester = document.getElementById('id-semester').value;
            const guru = document.getElementById('id-guru').value;

            if (!mapel || !kelas || !semester || !guru) {
                alert("Harap lengkapi semua field Identitas Evaluasi yang bertanda bintang (*).");
                return;
            }
            
            // Simpan identitas ke state
            appState.identitas = { mapel, kelas, semester, kurikulum: 'Merdeka', guru };
            saveState();

            // 2. Kalkulasi Data (Ekstrak ke list datar / array of items)
            generatedData = [];
            let currentNo = 1;
            
            for (let i = 0; i < appState.blocks.length; i++) {
                const block = appState.blocks[i];
                if (!block.tp || !block.materi) {
                    alert(`Baris ke-${i+1} belum memiliki Tujuan Pembelajaran atau Materi.`);
                    return;
                }
                
                const jMudah = parseInt(block.jmlMudah) || 0;
                const jSedang = parseInt(block.jmlSedang) || 0;
                const jSulit = parseInt(block.jmlSulit) || 0;
                
                if (jMudah + jSedang + jSulit === 0) {
                    alert(`Baris ke-${i+1} minimal harus memiliki 1 jumlah soal di salah satu tingkat kesulitan.`);
                    return;
                }

                // Push item Mudah
                for(let m=0; m<jMudah; m++) { pushSoalItem(block, 'Mudah', currentNo++); }
                // Push item Sedang
                for(let s=0; s<jSedang; s++) { pushSoalItem(block, 'Sedang', currentNo++); }
                // Push item Sulit
                for(let t=0; t<jSulit; t++) { pushSoalItem(block, 'Sulit', currentNo++); }
            }

            // 3. Render Visual (Animasi Loading Sederhana)
            const btn = document.getElementById('btn-generate');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<svg class="animate-spin w-5 h-5 mr-2" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10" stroke-width="4" stroke-linecap="round" class="opacity-25"></circle><path d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" class="opacity-75"></path></svg> Memproses...';
            btn.disabled = true;

            setTimeout(() => {
                renderDokumen();
                
                document.getElementById('view-setup').classList.add('hidden');
                document.getElementById('view-results').classList.remove('hidden');
                document.getElementById('view-results').classList.add('flex');
                
                btn.innerHTML = originalHTML;
                btn.disabled = false;
                
                switchTab('naskah'); // default tab
            }, 800);
        }

        function pushSoalItem(block, tingkat, no) {
            generatedData.push({
                no: no,
                tp: block.tp,
                materi: block.materi,
                bentuk: block.bentukSoal,
                tingkat: tingkat,
                img: block.imgBase64,
                indikator: `Disajikan stimulus, murid dapat ${getIndikatorKKO(tingkat, block.materi)}`
            });
        }

        function getIndikatorKKO(tingkat, materi) {
            // Simulasi taksonomi bloom / KKO sederhana untuk indikator otomatis
            if (tingkat === 'Mudah') return `menyebutkan bagian dari ${materi.toLowerCase()} dengan benar.`;
            if (tingkat === 'Sedang') return `menjelaskan konsep ${materi.toLowerCase()} secara logis.`;
            return `menganalisis permasalahan terkait ${materi.toLowerCase()} secara kritis.`;
        }

            document.getElementById('content-kartu').innerHTML = html;

        function renderKunci() {
            let html = buildKopHeader('KUNCI JAWABAN & PEDOMAN PENSKORAN');
            
            html += `
                <table class="w-full text-sm text-left border border-black mb-6">
                    <thead class="bg-gray-100 font-bold text-center">
                        <tr>
                            <th class="border border-black p-2 w-12">No.</th>
                            <th class="border border-black p-2">Kunci Jawaban</th>
                            <th class="border border-black p-2 w-24">Skor Maksimal</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            generatedData.forEach(item => {
                // Tentukan skor default berdasar bentuk
                let skor = 1;
                if (item.bentuk === 'Isian Singkat') skor = 2;
                if (item.bentuk === 'Uraian') skor = (item.tingkat === 'Sulit') ? 5 : 4;

                html += `
                    <tr>
                        <td class="border border-black p-2 text-center">${item.no}</td>
                        <td class="border border-black p-2 text-gray-400 italic">[Tulis Kunci Jawaban di sini]</td>
                        <td class="border border-black p-2 text-center">${skor}</td>
                    </tr>
                `;
            });
            html += `</tbody></table>`;
            document.getElementById('content-kunci').innerHTML = html;
        }


        /**
         * NAVIGASI TAB & CETAK
         */
        function switchTab(target) {
            // Update UI Tab Button
            ['naskah', 'kisi', 'kartu', 'kunci'].forEach(id => {
                const btn = document.getElementById('tab-' + id);
                if (id === target) {
                    btn.classList.add('tab-active');
                    btn.classList.remove('tab-inactive');
                } else {
                    btn.classList.add('tab-inactive');
                    btn.classList.remove('tab-active');
                }
            });

            // Update Konten
            ['naskah', 'kisi', 'kartu', 'kunci'].forEach(id => {
                const div = document.getElementById('content-' + id);
                if (id === target) {
                    div.classList.remove('hidden');
                    div.classList.add('block');
                    // Sinkronkan ke area print khusus
                    document.getElementById('print-area').innerHTML = div.innerHTML;
                } else {
                    div.classList.add('hidden');
                    div.classList.remove('block');
                }
            });
        }

        function backToSetup() {
            document.getElementById('view-results').classList.add('hidden');
            document.getElementById('view-results').classList.remove('flex');
            document.getElementById('view-setup').classList.remove('hidden');
        }

    </script>
</body>
</html>
